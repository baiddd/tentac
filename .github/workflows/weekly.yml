name: Build weekly issue

on:
  schedule:
    - cron: "0 6 * * MON"   # Monday 06:00 UTC, covers the week that just closed
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to rebuild, e.g. 2026-W34"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-

      - name: Fetch
        run: python pipeline/fetch.py --week "${{ inputs.week }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Score
        run: python pipeline/score.py --week "${{ inputs.week }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build
        run: python pipeline/build.py --week "${{ inputs.week }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit issue
        run: |
          git config user.name  "ai-weekly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "issue: $(date -u +%G-W%V)"
          git push
