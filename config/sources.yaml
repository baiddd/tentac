# -----------------------------------------------------------------------------
# SECURITY — fastest-moving section. Vendor research blogs break these first.
# Reference incidents this section is designed to catch:
#   - LiteLLM / TeamPCP (Mar 2026): poisoned PyPI releases via a compromised
#     build-pipeline scanner; ~2,500 orgs and ~434k CI/CD pipelines exposed.
#   - keyv / cacheable npm worm (Aug 2026): maintainer account takeover, 444
#     packages, 2,234 poisoned versions; payload persisted in AI coding-agent
#     and IDE config files that dependency scanners do not read.
# -----------------------------------------------------------------------------
security:
  - id: wiz-blog
    kind: rss
    url: https://www.wiz.io/blog/rss.xml
    tier: 1
    sections: [security]
  - id: socket-blog
    kind: rss
    url: https://socket.dev/api/blog/feed.atom
    tier: 1
    sections: [security]
  - id: snyk-blog
    kind: rss
    url: https://snyk.io/blog/feed/
    tier: 2
    sections: [security]
  - id: datadog-security-labs
    kind: rss
    url: https://securitylabs.datadoghq.com/rss/feed.xml
    tier: 1
    sections: [security]
  - id: aikido-blog
    kind: rss
    url: https://www.aikido.dev/blog/rss.xml
    tier: 2
    sections: [security]
  - id: the-hacker-news
    kind: rss
    url: https://feeds.feedburner.com/TheHackersNews
    tier: 3
    filter_keywords: [ai, llm, npm, pypi, mcp, agent, model, huggingface]
    sections: [security]
  - id: bleepingcomputer
    kind: rss
    url: https://www.bleepingcomputer.com/feed/
    tier: 3
    filter_keywords: [ai, llm, npm, pypi, supply chain, mcp]
    sections: [security]
  - id: cisa-advisories
    kind: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    tier: 1
    sections: [security]
  - id: github-advisories
    kind: api
    url: https://api.github.com/graphql
    tier: 2
    note: "GraphQL securityVulnerabilities(ecosystem: PIP|NPM), ordered by UPDATED_AT (no publishedSince filter exists on this field). Needs GITHUB_TOKEN."
    sections: [security]

