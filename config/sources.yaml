# =============================================================================
# sources.yaml — source registry for the weekly AI feed
#
# kind: rss | arxiv | api | scrape
# tier: 1 = always surface if relevant, 2 = normal, 3 = only if strong signal
# sections: candidate sections. The classifier picks the final one, but a
#           source's declared sections act as a prior / restrict the choices.
# =============================================================================

# relevance_keywords — the prefilter gate for tier-2/3 arXiv items with no
# other auto-keep signal (no CVE, no HF upvotes >= 30). An arXiv category
# alone (cs.CV, cs.LG, cs.AI, cs.CR) does not imply relevance: most
# submissions there are narrow domain applications (medical imaging, niche
# optimization theory) a working AI practitioner has no reason to see in a
# weekly digest. Matched against the TITLE only (body-text matches are too
# noisy — related-work mentions fire on almost every paper), case-insensitive,
# on a word boundary but tolerant of surrounding punctuation (see
# pipeline/score.py's _is_relevant — "RAG:" matches "rag" even though a colon
# immediately follows).
#
# Tune this list weekly: if a real item got wrongly dropped, add the phrase
# that should have caught it (check data/scored/<week>.jsonl against
# data/prefiltered/<week>.jsonl for the week's known-good items that didn't
# survive); if a section is flooded with noise, remove an over-firing term.
# Prefer multi-word phrases — single words like "agent" or "transformer"
# match nearly everything and defeat the filter's purpose — but note that a
# short, well-known abbreviation (llm, rag, moe, vlm) is fine on its own
# specifically because the word-boundary check keeps it from matching inside
# a larger token.
relevance_keywords:
  - "chain-of-thought"
  - "diffusion model"
  - "hallucination"
  - "jailbreak"
  - "prompt injection"
  - "red-team"
  - "red team"
  - "mixture-of-experts"
  - "moe"
  - "quantization"
  - "retrieval-augmented"
  - "rag"
  - "scaling law"
  - "text-to-image"
  - "text-to-video"
  - "world model"
  - "in-context learning"
  - "rlhf"
  - "dpo"
  - "instruction tuning"
  - "interpretability"
  - "reward model"
  - "reward hacking"
  - "watermark"
  - "backdoor"
  - "reasoning model"
  - "tool use"
  - "tool-use"
  - "agentic"
  - "vision-language model"
  - "foundation model"
  - "large language model"
  - "language model"
  - "llm"
  - "vlm"
  - "mllm"
  - "multimodal large language"

sections:
  - id: llm
    label: "LLM & reasoning"
    blurb: "Models, training, benchmarks, agents"
  - id: vision
    label: "Vision & image generation"
    blurb: "Segmentation, diffusion, video, 3D"
  - id: multimodal
    label: "Multimodal & audio"
    blurb: "VLMs, speech, cross-modal"
  - id: systems
    label: "Systems & efficiency"
    blurb: "Quantization, inference, hardware, RL post-training"
  - id: science
    label: "AI for science"
    blurb: "Biology, materials, climate"
  - id: security
    label: "AI security"
    blurb: "Supply chain, prompt injection, agent vulnerabilities"
  - id: safety
    label: "Safety & alignment"
    blurb: "Evals, interpretability, red-teaming, governance"
  - id: industry
    label: "Industry & policy"
    blurb: "Funding, launches, regulation"

