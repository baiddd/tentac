    kind: arxiv
    category: cs.CV
    tier: 2
    sections: [vision, multimodal]
  - id: arxiv-cs-lg
    kind: arxiv
    category: cs.LG
    tier: 2
    sections: [llm, systems]
  - id: arxiv-cs-ai
    kind: arxiv
    category: cs.AI
    tier: 2
    sections: [llm, safety]
  - id: arxiv-cs-cr
    kind: arxiv
    category: cs.CR
    tier: 2
    sections: [security, safety]
  - id: arxiv-eess-iv
    kind: arxiv
    category: eess.IV
    tier: 3
    sections: [vision]

  - id: hf-daily-papers
    kind: api
    url: https://huggingface.co/api/daily_papers
    tier: 1
    note: "Pre-curated + carries an upvote signal. Best single popularity proxy."
    sections: [llm, vision, multimodal, systems]

  - id: openreview
    kind: api
    url: https://api2.openreview.net/notes
    tier: 1
    cadence: burst          # NeurIPS/ICLR/ICML land in annual waves, not weekly
    venues: [NeurIPS.cc, ICLR.cc, ICML.cc]
    note: "Treat as a special edition when a decision wave drops. Do not expect weekly volume."
    sections: [llm, vision, multimodal, systems]

