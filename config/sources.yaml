  - id: arxiv-cs-lg
    kind: arxiv
    category: cs.LG
    tier: 2
    sections: [llm, systems]
  - id: arxiv-cs-ai
    kind: arxiv
    category: cs.AI
    tier: 2
    sections: [llm, safety]
  - id: arxiv-cs-cr
    kind: arxiv
    category: cs.CR
    tier: 2
    sections: [security, safety]
  - id: arxiv-eess-iv
    kind: arxiv
    category: eess.IV
    tier: 3
    sections: [vision]

  - id: hf-daily-papers
    kind: api
    url: https://huggingface.co/api/daily_papers
    tier: 1
    note: "Pre-curated + carries an upvote signal. Best single popularity proxy."
    sections: [llm, vision, multimodal, systems]

  - id: openreview
    kind: api
    url: https://api2.openreview.net/notes
    tier: 1
    cadence: burst          # NeurIPS/ICLR/ICML land in annual waves, not weekly
    venues: [NeurIPS.cc, ICLR.cc, ICML.cc]
    note: >
      Treat as a special edition when a decision wave drops. Do not expect
      weekly volume. As of 2026-08 this endpoint returns a genuine active
      Cloudflare-style challenge (403 ChallengeRequiredError) regardless of
      client library (confirmed with both httpx and requests) — not a
      stale-URL or fingerprint quirk. Fixing this needs a legitimate
      OpenReview API login (free account + API key), not a workaround; left
      enabled since it costs nothing when it fails and would self-heal if
      OpenReview relaxes this. Until then, manual inclusion of standout
      accepted papers during a decision wave is the fallback.
    sections: [llm, vision, multimodal, systems]

